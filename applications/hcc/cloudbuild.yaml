  - name: 'python:3.9-slim'
    id: 'run-update-script'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "Installing dependencies..."
        pip install --quiet --no-warn-script-location pyyaml google-cloud-compute

        echo "Running update script for project ${PROJECT_ID}..."
        python ./applications/hcc/update_zone_region.py --project_id "$PROJECT_ID"
        echo "Script finished."

  - name: 'gcr.io/cloud-builders/git' # 使用包含 Git 的镜像
    id: 'check-git-diff'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "Checking for file modifications..."

        # 获取 Git 状态
        git_status_output=$(git status --porcelain)

        if [ -z "$git_status_output" ]; then
          # 无变化
          echo "SUCCESS: No uncommitted changes detected. Workspace is clean."
        else
          # 检测到变化
          echo "ERROR: Uncommitted changes detected after running the script!"
          echo "-------------------- GIT STATUS --------------------"
          echo "$git_status_output"
          echo "-------------------- GIT DIFF (Tracked Files) ------"
          git diff # 显示已跟踪文件的 diff (可能为空)
          echo "-------------------- NEW FILES (Untracked) ---------"
          # 查找状态为 '??' (未跟踪) 的文件并打印它们的内容
          # 使用 grep 过滤出未跟踪的文件行，即使 grep 没找到匹配项也不让 set -e 退出 (|| true)
          untracked_lines=$(echo "$git_status_output" | grep '^?? ' || true)
          if [ -n "$untracked_lines" ]; then
            echo "$untracked_lines" | while IFS= read -r line; do
              # 提取文件名 (移除 '?? ' 前缀)
              untracked_file="${line#\?? }"
              echo ">>> Content of new file: '$untracked_file' <<<"
              # 使用 cat 显示新文件内容
              cat "$untracked_file"
              echo "--- End of new file: '$untracked_file' ---"
              echo "" # Add a blank line for readability
            done
          else
            echo "(No new untracked files detected)"
          fi
          echo "----------------------------------------------------"
          echo "FAILURE: Build failed due to unexpected file changes."
          echo "Please review the status, diff, and new file content above."
          echo "If these changes are expected, add/commit them to your repository."
          echo "Otherwise, update the script or source files."
          exit 1 # 步骤失败退出
        fi
    

